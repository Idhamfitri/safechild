name: fasttext_flutter
description: >-
  On-device text classification and sentence embeddings using fastText .ftz
  quantized models via Dart FFI. Verified on Android. Contributions welcome 
version: 0.1.2

repository: https://github.com/FahadQasim283/fasttext_flutter
issue_tracker: https://github.com/FahadQasim283/fasttext_flutter/issues

topics:
  - nlp
  - machine-learning
  - ffi
  - text-classification
  - embeddings

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  code_assets: ^1.0.0
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  hooks: ^1.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.17.4
  path_provider: ^2.1.4

dev_dependencies:
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  test: ^1.28.0
